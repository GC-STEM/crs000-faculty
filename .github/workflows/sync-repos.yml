name: Sync Repository Updates
on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs every night
  workflow_dispatch: # Allows manual sync manually via a button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout student code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and Merge Repository Updates
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # 1. Add the course master repo as a remote
          git remote add course_master https://github.com
          git fetch course_master main

          # 2. Merge changes while ignoring unrelated histories
          # This forces Git to do a line-by-line diff tracking even without a shared root commit
          # git merge course_master/main --allow-unrelated-histories -X ours
          git merge course_master/main --allow-unrelated-histories -m "Sync static repository files from staff template"

          # 3. Push back to student repo
          git push origin main
